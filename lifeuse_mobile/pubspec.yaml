name: lifeuse_mobile
description: "LifeUse - Premium Minimalist Mobile Application connected to LifeUse Spring Boot Backend."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  google_fonts: ^6.2.1
  intl: ^0.20.3
  flutter_animate: ^4.5.2
  flutter_svg: ^2.3.2
  lottie: ^3.8.2
  lucide_icons_flutter: ^4.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
